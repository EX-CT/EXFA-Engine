[workspace]
resolver = "2"
members = [
    "crates/eve-dogma-codegen", "crates/eve-sde", "crates/eve-fit-model", "crates/eve-capsim", "crates/eve-dogma",
    "crates/eve-fit-formats", "crates/eve-cli", "crates/eve-wasm", "crates/eve-fit-formats-wasm",
]
default-members = [
    "crates/eve-dogma-codegen", "crates/eve-sde", "crates/eve-fit-model", "crates/eve-capsim", "crates/eve-dogma",
    "crates/eve-fit-formats", "crates/eve-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
repository = "https://github.com/EX-CT/eve-dogma"

[workspace.dependencies]
eve-capsim = { path = "crates/eve-capsim" }
eve-dogma = { path = "crates/eve-dogma" }
eve-dogma-codegen = { path = "crates/eve-dogma-codegen" }
eve-sde = { path = "crates/eve-sde" }
eve-fit-model = { path = "crates/eve-fit-model" }
eve-fit-formats = { path = "crates/eve-fit-formats" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
itoa = "1"
zmij = "1"
flate2 = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release-small]
inherits = "release"
opt-level = "z"
strip = true
