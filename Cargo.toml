[workspace]
resolver = "2"
members = [
    "crates/exfa-codegen", "crates/exfa-core",
    "crates/exfa-formats", "crates/exfa-cli", "crates/exfa-wasm", "crates/exfa-formats-wasm", "crates/exfa-optimizer",
]
default-members = [
    "crates/exfa-codegen", "crates/exfa-core",
    "crates/exfa-formats", "crates/exfa-cli", "crates/exfa-optimizer",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "LGPL-3.0-or-later"
repository = "https://github.com/EX-CT/EXFA-Engine"

[workspace.dependencies]
exfa-core = { path = "crates/exfa-core" }
exfa-codegen = { path = "crates/exfa-codegen" }
exfa-formats = { path = "crates/exfa-formats" }
exfa-optimizer = { path = "crates/exfa-optimizer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
itoa = "1"
zmij = "1"
flate2 = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release-small]
inherits = "release"
opt-level = "z"
strip = true
