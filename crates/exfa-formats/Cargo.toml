[package]
name = "exfa-formats"
description = "EVE fit formats (EFT, DNA, ESI JSON, XML, multibuy, ship stats text): text <-> structured FitRequest; no engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# exfa-core for the shared data contract (`sde` static tables + `model` FitRequest types); engine eval code is
# dead-stripped from consumers that only touch data (e.g. the formats-only wasm bundle).
exfa-core.workspace = true
serde_json.workspace = true
