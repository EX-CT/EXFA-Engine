name: ci

# Gate for EXFA-Engine. Also a reusable workflow: sde-update.yml calls this file via `workflow_call`
# with `sde_tag` (override the tag pinned in sde.lock) and `skip_round1_sha` (new data legitimately
# changes the round-1 byte checks).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sde_tag:
        description: 'SDE release tag (default: sde.lock)'
        required: false
        default: ''
      skip_round1_sha:
        description: 'skip the two round-1 sha checks'
        type: boolean
        default: false
  workflow_call:
    inputs:
      sde_tag:
        description: 'SDE release tag (default: sde.lock)'
        type: string
        required: false
        default: ''
      skip_round1_sha:
        description: 'skip the two round-1 sha checks'
        type: boolean
        required: false
        default: false

env:
  CARGO_TERM_COLOR: always
  SDE_TAG: ${{ inputs.sde_tag }}

jobs:
  build:
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dataset (sde.lock${{ inputs.sde_tag && format(' overridden to {0}', inputs.sde_tag) || '' }})
        shell: bash
        run: |
          tag="${SDE_TAG:-$(cut -d= -f2 sde.lock)}"
          echo "SDE_TAG=$tag" >> "$GITHUB_ENV"
          gh release download "$tag" -R EX-CT/EXFA-Data --pattern 'dataset-*.json.gz' -D _data
          f=$(ls "$PWD"/_data/dataset-*.json.gz | head -1)
          # bash on Windows yields an MSYS path (/d/a/...) that the pwsh-run cargo cannot read
          if command -v cygpath > /dev/null; then f=$(cygpath -m "$f"); fi
          echo "EXFA_DATASET=$f" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked -p exfa-cli
      - name: Test
        run: cargo test --workspace --locked

  suites:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pyyaml
      - name: bench.lock
        run: |
          set -euo pipefail
          grep '^BENCH_' bench.lock
          repo=$(grep '^BENCH_REPO=' bench.lock | cut -d= -f2)
          [ "$repo" = "EX-CT/EXFA-Bench" ] || { echo "::error::unexpected BENCH_REPO=$repo"; exit 1; }
          echo "BENCH_SHA=$(grep '^BENCH_SHA=' bench.lock | cut -d= -f2)" >> "$GITHUB_ENV"
      - name: Checkout EXFA-Bench (pinned by bench.lock)
        uses: actions/checkout@v4
        with:
          repository: EX-CT/EXFA-Bench
          path: _bench
          fetch-depth: 0
      - name: Pin EXFA-Bench to bench.lock
        run: git -C _bench checkout -q "$BENCH_SHA"
      - name: Dataset (${{ env.SDE_TAG || 'sde.lock' }})
        run: |
          tag="${SDE_TAG:-$(cut -d= -f2 sde.lock)}"
          echo "SDE_TAG=$tag" >> "$GITHUB_ENV"
          gh release download "$tag" -R EX-CT/EXFA-Data --pattern 'dataset-*.json.gz' -D _data
          echo "EXFA_DATASET=$(ls $PWD/_data/dataset-*.json.gz | head -1)" >> "$GITHUB_ENV"
      - name: Pyfa presets (GPL oracle data for ext_rpc/ext cases; regenerated with renamed-item conversions — EXFA-Bench presets-pyfa-3569502-r6)
        run: |
          gh release download presets-pyfa-3569502-r6 -R EX-CT/EXFA-Bench --pattern 'presets-pyfa-*' -D _data
          echo "EXFA_PYFA_DATA=$(ls $PWD/_data/presets-pyfa-*.json | head -1)" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked -p exfa-cli
      - name: Suites
        run: bash ci/run_suites.sh native ./target/release/exfa ${{ inputs.skip_round1_sha && 'skip-round1' || '' }}
      - name: Inventory coverage (informative)
        run: |
          curl -fsSL https://raw.githubusercontent.com/EX-CT/EXFA-Docs/main/docs/19-pyfa-feature-inventory.yaml -o /tmp/inventory.yaml
          python3 _bench/tools/check_inventory.py --inventory /tmp/inventory.yaml --bench-repo _bench --root unit=../EXFA-Engine --columns f || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-results-native
          path: ci-results/native
          if-no-files-found: ignore

  suites-wasm:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pyyaml
      - name: bench.lock
        run: |
          set -euo pipefail
          grep '^BENCH_' bench.lock
          repo=$(grep '^BENCH_REPO=' bench.lock | cut -d= -f2)
          [ "$repo" = "EX-CT/EXFA-Bench" ] || { echo "::error::unexpected BENCH_REPO=$repo"; exit 1; }
          echo "BENCH_SHA=$(grep '^BENCH_SHA=' bench.lock | cut -d= -f2)" >> "$GITHUB_ENV"
      - name: Checkout EXFA-Bench (pinned by bench.lock)
        uses: actions/checkout@v4
        with:
          repository: EX-CT/EXFA-Bench
          path: _bench
          fetch-depth: 0
      - name: Pin EXFA-Bench to bench.lock
        run: git -C _bench checkout -q "$BENCH_SHA"
      - name: Dataset (${{ env.SDE_TAG || 'sde.lock' }})
        run: |
          tag="${SDE_TAG:-$(cut -d= -f2 sde.lock)}"
          echo "SDE_TAG=$tag" >> "$GITHUB_ENV"
          gh release download "$tag" -R EX-CT/EXFA-Data --pattern 'dataset-*.json.gz' -D _data
          echo "EXFA_DATASET=$(ls $PWD/_data/dataset-*.json.gz | head -1)" >> "$GITHUB_ENV"
      - name: Pyfa presets (GPL oracle data for ext_rpc/ext cases; regenerated with renamed-item conversions — EXFA-Bench presets-pyfa-3569502-r6)
        run: |
          gh release download presets-pyfa-3569502-r6 -R EX-CT/EXFA-Bench --pattern 'presets-pyfa-*' -D _data
          echo "EXFA_PYFA_DATA=$(ls $PWD/_data/presets-pyfa-*.json | head -1)" >> "$GITHUB_ENV"
      - name: Build wasip1
        run: cargo build --release --locked --target wasm32-wasip1 -p exfa-cli
      - name: Install wasmtime
        run: curl -fsSL https://wasmtime.dev/install.sh | bash -s -- --version v33.0.0
      - name: Suites
        run: |
          export PATH="$HOME/.wasmtime/bin:$PATH"
          # --dir $PWD: the contract's file APIs (--prices/--sde/prices_load/sde_override paths) must read case files
          # inside the checkout (_bench/, _data/); without a preopen the wasm guest sees every path as missing.
          # EXFA_PYFA_DATA must also be forwarded: the guest only sees envs listed via --env (market.search
          # jargon and builtin damage patterns are loaded from the pyfa-presets file at run time).
          bash ci/run_suites.sh wasm "wasmtime run --dir $PWD --env EXFA_DATASET=$EXFA_DATASET --env EXFA_PYFA_DATA=$EXFA_PYFA_DATA $PWD/target/wasm32-wasip1/release/exfa.wasm" ${{ inputs.skip_round1_sha && 'skip-round1' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-results-wasm
          path: ci-results/wasm
          if-no-files-found: ignore
