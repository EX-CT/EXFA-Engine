name: sde-update

# Drives a new EXFA-Data SDE release through the engine. EXFA-Data's sde.yml sends a
# repository_dispatch (type sde-release, client_payload {tag, sde_build, revision}) after each
# dataset release; this workflow can also be run manually with the same tag.
#
# Flow: if sde.lock already pins the tag -> exit. Otherwise run the whole ci.yml gate against the
# new dataset (workflow_call, skip_round1_sha: new data legitimately changes the round-1 bytes).
# On green: update sde.lock, regenerate the two round-1 shas from the new output, bump the workspace
# patch version, commit "Update SDE to <tag>", tag v<version> and call release.yml (GITHUB_TOKEN-pushed
# tags do not fire on:push tag triggers). On gate failure: open an issue, main untouched.
#
# The repository_dispatch path needs a PAT (EXFA_DISPATCH_TOKEN) on the EXFA-Data side; the 6-hourly
# schedule below polls the latest public sde-* release instead, so upgrades happen either way.
on:
  repository_dispatch:
    types: [sde-release]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'EXFA-Data SDE release tag (default: latest sde-* release)'
        required: false
        default: ''
      bench_sha:
        description: 'EXFA-Bench commit to gate against (default: bench.lock); also written into bench.lock on update'
        required: false
        default: ''

concurrency:
  group: sde-update

permissions:
  contents: write
  issues: write

env:
  NEW_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || inputs.tag }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.c.outputs.proceed }}
      tag: ${{ steps.c.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          set -euo pipefail
          cur=$(cut -d= -f2 sde.lock)
          tag="$NEW_TAG"
          # scheduled run or manual dispatch without a tag: poll the latest sde-* release
          if [ -z "$tag" ]; then
            tag=$(gh release list -R EX-CT/EXFA-Data --json tagName --jq '[.[] | select(.tagName | startswith("sde-"))][0].tagName')
            echo "polled latest EXFA-Data SDE release: ${tag:-<none>}"
          fi
          echo "sde.lock pins $cur; incoming ${tag:-<none>}"
          if [ -z "$tag" ]; then
            echo "::notice::no sde-* release found — nothing to do"
            echo "proceed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$tag" = "$cur" ]; then
            echo "sde.lock already at $tag — nothing to do"
            echo "proceed=0" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=1" >> "$GITHUB_OUTPUT"
          fi

  gate:
    needs: check
    if: needs.check.outputs.proceed == '1'
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    with:
      sde_tag: ${{ needs.check.outputs.tag }}
      bench_sha: ${{ inputs.bench_sha }}
      skip_round1_sha: true

  update:
    needs: [check, gate]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.b.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      NEW_TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: bench.lock + EXFA-Bench checkout
        env:
          BENCH_OVERRIDE: ${{ inputs.bench_sha }}
        run: |
          set -euo pipefail
          grep '^BENCH_' bench.lock
          echo "BENCH_SHA=${BENCH_OVERRIDE:-$(grep '^BENCH_SHA=' bench.lock | cut -d= -f2)}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: EX-CT/EXFA-Bench
          path: _bench
          fetch-depth: 0
      - name: Pin EXFA-Bench
        run: git -C _bench checkout -q "$BENCH_SHA"
      - name: New dataset ($NEW_TAG)
        run: |
          set -euo pipefail
          gh release download "$NEW_TAG" -R EX-CT/EXFA-Data --pattern 'dataset-*.json.gz' -D _data
          echo "EXFA_DATASET=$(ls $PWD/_data/dataset-*.json.gz | head -1)" >> "$GITHUB_ENV"
      - name: Refresh embedded price snapshot (its sde_build stamp should match this build)
        # EXFA-Data's sde.yml produces a snapshot on this SDE right after the dataset release, so the newest
        # prices-* tag normally carries the same sde_build. If it doesn't (snapshot failed / not published
        # yet) embed it anyway — freshest prices beat a stale file; the engine just warns at runtime.
        run: |
          set -euo pipefail
          B=${NEW_TAG#sde-}; B=${B%%-*}
          PTAG=$(gh release list -R EX-CT/EXFA-Data --json tagName --jq '[.[] | select(.tagName | startswith("prices-"))][0].tagName')
          echo "price snapshot release: ${PTAG:-<none>}"
          [ -z "$PTAG" ] && { echo "::warning::no prices-* release in EXFA-Data — keeping the current embedded snapshot"; exit 0; }
          gh release download "$PTAG" -R EX-CT/EXFA-Data -D _prices -p 'prices-*.json.gz'
          python3 - "$(ls _prices/prices-*.json.gz | head -1)" "$B" <<'EOF'
          import gzip, json, re, sys, pathlib
          f, want_build = sys.argv[1], int(sys.argv[2])
          s = json.loads(gzip.decompress(pathlib.Path(f).read_bytes()))
          sid, mtime, chash, ntypes = s["snapshot_id"], s["market_time"], s["content_hash"], s["type_count"]
          data = pathlib.Path("crates/exfa-core/data")
          for old in data.glob("prices-*.json.gz"):
              old.unlink()
          dest = data / f"prices-{sid}.json.gz"
          dest.write_bytes(pathlib.Path(f).read_bytes())
          p = pathlib.Path("crates/exfa-core/src/price.rs"); t = p.read_text(encoding="utf-8")
          t = re.sub(r'include_bytes!\("\.\./data/prices-[^"]+"\)', f'include_bytes!("../data/{dest.name}")', t)
          t = re.sub(r'EMBEDDED_ID: &str = "[^"]+"', f'EMBEDDED_ID: &str = "{sid}"', t)
          t = re.sub(r'EMBEDDED_TIME: &str = "[^"]+"', f'EMBEDDED_TIME: &str = "{mtime}"', t)
          t = re.sub(r'EMBEDDED_HASH: &str = "[^"]+"', f'EMBEDDED_HASH: &str = "{chash}"', t)
          t = re.sub(r'EMBEDDED_TYPES: usize = \d+', f'EMBEDDED_TYPES: usize = {ntypes}', t)
          p.write_text(t, encoding="utf-8")
          print(f"embedded snapshot -> {sid} ({ntypes} types, sde_build {s.get('sde_build')}, market_time {mtime})")
          if s.get("sde_build") != want_build:
              print(f"::warning::snapshot sde_build {s.get('sde_build')} != dataset build {want_build} — embedded anyway (freshest available)")
          EOF
      - name: sde.lock + version bump + rebuild
        id: b
        env:
          BENCH_OVERRIDE: ${{ inputs.bench_sha }}
        run: |
          set -euo pipefail
          sed -i "s/^SDE_TAG=.*/SDE_TAG=$NEW_TAG/" sde.lock
          # keep bench.lock consistent with the pin the gate ran against (workflow_dispatch override)
          if [ -n "${BENCH_OVERRIDE:-}" ]; then
            sed -i "s/^BENCH_SHA=.*/BENCH_SHA=$BENCH_OVERRIDE/" bench.lock
            echo "bench.lock -> $BENCH_OVERRIDE"
          fi
          NEW_VER=$(python3 - <<'EOF'
          import re, pathlib
          p = pathlib.Path("Cargo.toml"); t = p.read_text()
          m = re.search(r'(?ms)^\[workspace\.package\].*?^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"', t)
          maj, mi, pa = map(int, m.groups()); new = f"{maj}.{mi}.{pa+1}"
          span = t[m.start():m.end()]
          p.write_text(t[:m.start()] + span.replace(f"{maj}.{mi}.{pa}", new, 1) + t[m.end():])
          print(new)
          EOF
          )
          echo "version bump -> $NEW_VER"
          # build without --locked so Cargo.lock picks up the workspace version bump
          cargo build --release -p exfa-cli
          echo "tag=v$NEW_VER" >> "$GITHUB_OUTPUT"
      - name: Regenerate round-1 shas on the new dataset
        run: |
          set -euo pipefail
          for f in _bench/suites/round1/cases/*.json; do python3 -c "import json,sys;print(json.dumps(json.load(open(sys.argv[1]))))" "$f"; done > /tmp/round1.jsonl
          ./target/release/exfa batch < /tmp/round1.jsonl > /tmp/round1.out.jsonl
          sha256sum < /tmp/round1.out.jsonl | cut -d' ' -f1 > ci/round1.sha256
          python3 ci/strip_keys.py $(grep -v '^#' ci/round1-new-keys.txt) < /tmp/round1.out.jsonl | sha256sum | cut -d' ' -f1 > ci/round1-base.sha256
          echo "round1.sha256     = $(cat ci/round1.sha256)"
          echo "round1-base.sha256 = $(cat ci/round1-base.sha256)"
      - name: Commit + tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sde.lock bench.lock Cargo.toml Cargo.lock ci/round1.sha256 ci/round1-base.sha256 crates/exfa-core/data crates/exfa-core/src/price.rs crates/exfa-core/tests/batch_prices.rs
          git commit -m "Update SDE to $NEW_TAG"
          git push origin main
          git tag "$TAG_OUT"
          git push origin "refs/tags/$TAG_OUT"
        env:
          TAG_OUT: ${{ steps.b.outputs.tag }}

  release:
    needs: update
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      tag: ${{ needs.update.outputs.tag }}
      dry_run: false

  blocked:
    needs: [check, gate]
    if: needs.check.outputs.proceed == '1' && failure()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NEW_TAG: ${{ needs.check.outputs.tag }}
    steps:
      - name: Open a blocking issue with the gate summary
        run: |
          set -uo pipefail
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # find the reusable ci.yml run spawned by this workflow_call and pull its step summaries
          summary=""
          cid=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --event workflow_call --limit 5 \
                  --json databaseId,createdAt --jq 'sort_by(.createdAt) | last | .databaseId' 2>/dev/null || true)
          if [ -n "$cid" ]; then
            for cr in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$cid/jobs" --jq '.jobs[].check_run_url | split("/")[-1]' 2>/dev/null); do
              t=$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$cr" --jq '.output.text // empty' 2>/dev/null || true)
              [ -n "$t" ] && summary="$summary
          $t"
            done
          fi
          {
            echo "EXFA-Data released SDE \`$NEW_TAG\` but the engine gate rejected it."
            echo ""
            echo "- sde-update run: $run_url"
            [ -n "$cid" ] && echo "- gate run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$cid"
            echo ""
            echo "## Gate summary"
            [ -n "$summary" ] && echo "$summary" || echo "(no step summaries found — see the gate run logs)"
          } > /tmp/issue.md
          cat /tmp/issue.md
          gh issue create -R "$GITHUB_REPOSITORY" --title "SDE $NEW_TAG blocked by the gate" --body-file /tmp/issue.md
