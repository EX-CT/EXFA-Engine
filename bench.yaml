# eve-dogma-bench manifest (eve-dogma Rust mainline, workspace; binary eve-fit). The dataset is compiled in at build time.
# Static glibc build (+crt-static, ~0.4 ms faster process start); falls back to the default dynamic build.
build: (EVE_DOGMA_DATASET={dataset} RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --target x86_64-unknown-linux-gnu && cp target/x86_64-unknown-linux-gnu/release/eve-fit target/eve-fit-bench) || (EVE_DOGMA_DATASET={dataset} cargo build --release && cp target/release/eve-fit target/eve-fit-bench)
cmd: ./target/eve-fit-bench calc
batch_cmd: ./target/eve-fit-bench batch
rpc_cmd: ./target/eve-fit-bench serve-stdio
# round 2 (graphs-round2): GraphRequest JSONL in -> GraphResult JSONL out
graph_batch_cmd: ./target/eve-fit-bench graph-batch
